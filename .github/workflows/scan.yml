name: Сканиране на търгове

on:
  schedule:
    - cron: "17 */4 * * *"     # на всеки 4 часа
  workflow_dispatch:
    inputs:
      only:
        description: "Само тези източници (id, разделени със запетая) – празно = всички"
        required: false
      rediscover:
        description: "Търси наново секциите с търгове (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_MINUTES: "85"
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ "${{ github.event.inputs.rediscover }}" = "true" ]; then ARGS="$ARGS --rediscover"; fi
          python -m scanner.run $ARGS
      - name: Commit data
        run: |
          git config user.name "imoti-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/data state sources
          git diff --cached --quiet && exit 0
          git commit -m "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
