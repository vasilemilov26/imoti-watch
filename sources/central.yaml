# Централни източници. Всеки запис:
#   id        – уникален ключ (латиница)
#   name      – име за показване
#   category  – apk | chsi | nap | darzhava | oblast | obshtina | dp | koncesii | zemya | agregator
#   kind      – cards  (списък с карти + страниране, виж parsers/cards.py)
#             – generic (страница/и с обяви – търсят се нови връзки/текстове)
#             – discover (дава се само начална страница; скенерът сам намира секцията с търгове)
#   urls      – конкретни страници (за generic/cards)
#   home      – начална страница (за discover)
#   enabled   – false = пропуска се
#
# Добавяйте свободно нови източници – най-лесно като kind: discover с home: <сайт>.

sources:
  # ---------------- АППК ----------------
  - id: appk-upcoming
    group: appk-e
    name: АППК – предстоящи търгове (е-платформа)
    category: apk
    kind: cards
    urls: ["https://estate-sales.uslugi.io/upcoming-public"]
    item_link: "/upcoming-public/view/\\d+"
    detail: true
    page_param: page
    max_pages: 50
  - id: appk-current
    group: appk-e
    name: АППК – текущи търгове (е-платформа)
    category: apk
    kind: cards
    urls: ["https://estate-sales.uslugi.io/public-bidding"]
    item_link: "/(public-bidding|upcoming-public|past-public)/view/\\d+"
    page_param: page
    max_pages: 20
  - id: appk-past
    group: appk-e
    name: АППК – приключили търгове (резултати)
    category: apk
    kind: cards
    urls: ["https://estate-sales.uslugi.io/past-public"]
    item_link: "/past-public/view/\\d+"
    page_param: page
    max_pages: 10
    results_only: true      # обновява статуса (успешен/неуспешен) на вече известни търгове
  - id: appk-publprodajbi
    name: АППК – публични продажби по изпълнителни дела
    category: apk
    kind: generic
    urls: ["https://appk.government.bg/bg/publprodajbi"]
  - id: appk-privatizacia
    name: АППК – приватизация (текущи проекти)
    category: apk
    kind: generic
    urls: ["https://appk.government.bg/bg/80"]

  # ---------------- Принудителни продажби ----------------
  - id: bcpea
    name: ЧСИ – Камара на частните съдебни изпълнители (имоти)
    category: chsi
    kind: cards
    urls: ["https://sales.bcpea.org/properties"]
    item_link: "/properties/\\d+$"
    page_param: p
    extra_params: {perpage: 48}
    max_pages: 400
  - id: nap
    name: НАП – портал за продажби (недвижими имоти)
    category: nap
    kind: cards
    urls: ["https://sales.nra.bg/realestate"]
    item_link: "/(realestate|sale|sales|auction|item|view)[/?][^\"']*\\d+"
    page_param: page
    max_pages: 60
  - id: izpalniteli
    name: izpalniteli.com – агрегатор (ЧСИ, НАП, ДСИ, синдици)
    category: agregator
    kind: generic
    urls: ["https://izpalniteli.com/targove/"]
    enabled: false   # частен сайт – включете само ако приемате условията му

